<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodHub - Order Food Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="logo">🍽️ Food<span>Hub</span></div>
    <button class="cart-btn" onclick="toggleCart()">
      🛒 Cart <span id="cart-count">0</span>
    </button>
  </header>

  <!-- HERO -->
  <section class="hero">
    <h1>Order Delicious Food, Anytime</h1>
    <p>Choose your favorite cuisine and get it delivered fast!</p>
  </section>

  <!-- CUISINE FILTER -->
  <nav class="cuisine-tabs" id="cuisine-tabs"></nav>

  <!-- MENU -->
  <main class="menu-grid" id="menu-grid"></main>

  <!-- CART SIDEBAR -->
  <aside class="cart-sidebar" id="cart-sidebar">
    <div class="cart-header">
      <h2>Your Order</h2>
      <button class="close-btn" onclick="toggleCart()">✖</button>
    </div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>Total:</span>
        <span id="cart-total">Rs. 0</span>
      </div>
      <button class="checkout-btn" onclick="openCheckout()">Proceed to Checkout</button>
    </div>
  </aside>
  <div class="overlay" id="overlay" onclick="toggleCart()"></div>

  <!-- CHECKOUT MODAL -->
  <div class="modal" id="checkout-modal">
    <div class="modal-box">
      <button class="close-btn" onclick="closeCheckout()">✖</button>
      <h2>Checkout</h2>

      <form id="checkout-form">
        <label>Full Name</label>
        <input type="text" id="cust-name" required placeholder="Your name">

        <label>Phone Number</label>
        <input type="tel" id="cust-phone" required placeholder="98XXXXXXXX">

        <label>Delivery Address</label>
        <textarea id="cust-address" required placeholder="Street, City"></textarea>

        <label>Payment Method</label>
        <div class="payment-options">
          <label class="payment-card">
            <input type="radio" name="payment" value="esewa" checked>
            <span>📱 eSewa</span>
          </label>
          <label class="payment-card">
            <input type="radio" name="payment" value="paypal">
            <span>💳 PayPal</span>
          </label>
          <label class="payment-card">
            <input type="radio" name="payment" value="cod">
            <span>💵 Cash on Delivery</span>
          </label>
        </div>

        <div class="modal-total">
          Order Total: <span id="modal-total">Rs. 0</span>
        </div>

        <button type="submit" class="place-order-btn">Place Order</button>
      </form>
    </div>
  </div>

  <!-- CONFIRMATION MODAL -->
  <div class="modal" id="confirm-modal">
    <div class="modal-box confirm-box">
      <div class="check-icon">✅</div>
      <h2>Order Placed!</h2>
      <p id="confirm-text"></p>
      <button class="place-order-btn" onclick="closeConfirm()">Done</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
